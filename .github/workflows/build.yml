name: Compilación VST3

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Compilar MICHEL DRUM LAB
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar CMake
        run: cmake -S . -B build -A x64

      - name: Compilar VST3
        shell: pwsh
        run: |
          cmake --build build --config Release --target MichelDrumLab_VST3 --parallel 2
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Guardar plugin compilado
        uses: actions/upload-artifact@v4
        with:
          name: MICHEL-DRUM-LAB-VST3
          path: build/MichelDrumLab_artefacts/Release/VST3/MICHEL DRUM LAB.vst3
          if-no-files-found: error
