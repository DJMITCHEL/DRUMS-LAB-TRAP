      - name: Build VST3
        shell: pwsh
        run: |
          cmake --build build --config Release --target MichelDrumLab_VST3 --parallel 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          Write-Host "=========== ERRORES ==========="
          Select-String -Path build.log -Pattern "error" | Select-Object -First 25 | ForEach-Object { $_.Line }
          exit $code
