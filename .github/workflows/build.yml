name: Build VST3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        shell: pwsh
        run: |
          cmake --build build --config Release --target MichelDrumLab_VST3 --parallel 2 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          Write-Host "=========== ERRORES ==========="
          Select-String -Path build.log -Pattern "error" | Select-Object -First 30 | ForEach-Object { $_.Line }
          exit $code

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $vst = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | Select-Object -First 1
          if (-not $vst) { throw "No se encontro el .vst3" }
          Copy-Item $vst.FullName dist -Recurse

      - uses: actions/upload-artifact@v4
        with:
          name: MICHEL-DRUM-LAB-VST3
          path: dist
